apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount.webserver }}
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      containers:
        - name: webserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: AIRFLOW__CORE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}
          command: ["bash", "-c"]
          args:
            - |
              airflow db init && \
              airflow users create \
                --username {{ .Values.airflow.webserver.user.username }} \
                --firstname {{ .Values.airflow.webserver.user.firstname }} \
                --lastname {{ .Values.airflow.webserver.user.lastname }} \
                --role Admin \
                --email {{ .Values.airflow.webserver.user.email }} \
                --password {{ .Values.airflow.webserver.user.password }} || true && \
              exec airflow webserver
          ports:
            - containerPort: {{ .Values.airflow.webserver.port }}
          volumeMounts:
            - name: dags
              mountPath: {{ .Values.dags.mountPath }}
            - name: logs
              mountPath: {{ .Values.logs.mountPath }}
      volumes:
        - name: dags
          hostPath:
            path: {{ .Values.dags.hostPath }}
            type: Directory
        - name: logs
          persistentVolumeClaim:
            claimName: {{ .Values.logs.pvcName }}
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: airflow-webserver
  ports:
    - port: {{ .Values.airflow.webserver.port }}
      targetPort: {{ .Values.airflow.webserver.port }}
      nodePort: {{ .Values.airflow.webserver.nodePort }}
  type: NodePort
