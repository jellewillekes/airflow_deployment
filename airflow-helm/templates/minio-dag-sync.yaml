apiVersion: v1
kind: ConfigMap
metadata:
  name: dag-sync-script
  namespace: {{ .Values.namespace }}
data:
  sync.sh: |
    #!/bin/sh
    set -e
    echo "Starting MinIO DAG sync daemon..."
    mc alias set minio http://minio.{{ .Values.minio.namespace }}.svc.cluster.local:{{ .Values.minio.s3Port }} {{ .Values.minio.accessKey }} {{ .Values.minio.secretKey }}
    mkdir -p {{ .Values.dags.mountPath }}
    while true; do
      echo "Syncing DAGs from minio/airflow-dags to {{ .Values.dags.mountPath }}..."
      mc cp --recursive minio/airflow-dags/ {{ .Values.dags.mountPath }}/
      echo "Sync complete. Sleeping for 60s..."
      sleep 60
    done
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dag-sync
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: dag-sync
  template:
    metadata:
      labels:
        app: dag-sync
    spec:
      containers:
        - name: dag-sync
          image: minio/mc
          command: ["/bin/sh", "/scripts/sync.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: dags
              mountPath: {{ .Values.dags.mountPath }}
      volumes:
        - name: scripts
          configMap:
            name: dag-sync-script
            defaultMode: 0755
        - name: dags
          hostPath:
            path: {{ .Values.dags.hostPath }}
            type: DirectoryOrCreate
